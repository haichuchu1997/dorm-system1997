<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<!-- ✅ スマホ画面ズーム完全禁止（追加） -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>入寮管理システム</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;font-family:'Nunito',system-ui;margin:0;padding:0;}
body{
  background:radial-gradient(circle at top,#0f172a,#020617);
  color:white;
  padding-bottom:320px;
}

/* Glass UI */
.glass{
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(20px);
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:0 20px 50px rgba(0,0,0,.4);
}

header{
  padding:16px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  letter-spacing:.5px;
}

/* Month selector */
.monthSelect{
  margin:10px;
  padding:12px;
  text-align:center;
}
.monthSelect input{
  padding:8px 14px;
  border-radius:12px;
  border:none;
  font-size:14px;
}

/* Grid */
.wrapper{padding:10px;}
.scroll{overflow:auto;max-height:70vh;position:relative;}
.grid{
  display:grid;
  grid-template-columns:60px repeat(10,80px);
  grid-auto-rows:28px;
  min-width:860px;
}
.grid div{
  height:28px;
  line-height:28px;
  font-size:12px;
  text-align:center;
  border-bottom:1px solid rgba(255,255,255,0.08);
  border-right:1px solid rgba(255,255,255,0.08);
}
.date{background:rgba(255,255,255,0.12);font-weight:bold;}
.dateSpan{grid-row:span 2;height:56px;line-height:56px;}
.sticky-top{position:sticky;top:0;z-index:5;background:rgba(0,0,0,0.7);}
.sticky-left{position:sticky;left:0;z-index:4;background:rgba(0,0,0,0.7);}
.sticky-corner{position:sticky;top:0;left:0;z-index:6;background:rgba(0,0,0,0.85);}

/* Bars */
.bar{
  position:absolute;width:80px;
  color:black;font-size:12px;font-weight:bold;
  display:flex;align-items:center;justify-content:center;
  border-radius:14px;
  touch-action:none;
  cursor:grab;
  box-shadow:0 10px 25px rgba(0,0,0,.4);
  transition:.15s;
}
.bar:active{transform:scale(1.02);box-shadow:0 20px 40px rgba(0,0,0,.8);}
.bar::before{
  content:"";
  position:absolute;
  inset:2px;
  border-radius:14px;
  z-index:-1;
}
.bar.red{background:rgba(255,80,80,0.7);}
.bar.red::before{background:#ff1a1a;}
.bar.blue{background:rgba(80,180,255,0.7);}
.bar.blue::before{background:#0080ff;}
.bar.yellow{background:rgba(255,255,80,0.7);}
.bar.yellow::before{background:#ffcc00;}

.handle{position:absolute;width:100%;height:6px;}
.handle.top{top:0;}
.handle.bottom{bottom:0;}

/* Drag Glow */
.bar.dragging{
  box-shadow:
    0 0 0 2px rgba(255,255,255,0.9),
    0 0 25px rgba(255,255,255,0.8),
    0 20px 40px rgba(0,0,0,0.9);
  transform:scale(1.03);
}

/* Dock */
.dock{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:calc(0px + env(safe-area-inset-bottom));
  width:100%;
  max-width:720px;
  padding:16px 20px 22px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:14px;
  background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.85));
  backdrop-filter:blur(20px);
  z-index:50;
}
.dock .sideBtn{
  flex:1;border:none;padding:14px 12px;border-radius:18px;
  font-weight:bold;font-size:15px;text-align:center;color:black;
  box-shadow:0 8px 25px rgba(0,0,0,.5);
}
.dock .fab{
  width:88px;height:88px;border-radius:50%;
  border:none;font-size:18px;font-weight:bold;
  background:linear-gradient(135deg,#ff0080,#ffcc00);
  color:black;
  box-shadow:0 15px 40px rgba(0,0,0,.7);
  transform:translateY(-22px);
}
.btn-calc{background:linear-gradient(135deg,#00ffa6,#00c8ff);}
.btn-wait{background:linear-gradient(135deg,#ff6600,#ffaa00);}
.dock button:active{transform:scale(.92);}

/* Modal */
.modalBg{
  position:fixed;inset:0;background:rgba(0,0,0,0.65);
  display:none;align-items:center;justify-content:center;z-index:99;
}
.modal{
  background:linear-gradient(180deg,rgba(40,40,80,.95),rgba(10,10,30,.95));
  backdrop-filter:blur(30px);
  padding:22px;border-radius:22px;width:320px;text-align:center;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.modal input{
  width:100%;padding:10px;border-radius:12px;border:none;margin-bottom:10px;
  font-size:16px !important; /* ✅ ズーム防止 */
}
.colorPick{display:flex;justify-content:space-around;margin:10px 0;}
.colorPick div{width:32px;height:32px;border-radius:50%;border:2px solid white;}
.redPick{background:red;}
.bluePick{background:blue;}
.yellowPick{background:yellow;}

.listBox{
  max-height:200px;
  overflow:auto;
  background:rgba(0,0,0,0.4);
  padding:10px;
  border-radius:10px;
  text-align:left;
}
</style>
</head>

<body>

<header>🏢 入寮管理システム</header>

<div class="monthSelect glass">
  表示月： <input type="month" id="monthPicker">
</div>

<div class="wrapper">
<div class="glass scroll" id="scroll">
  <div class="grid" id="grid"></div>
</div>
</div>

<!-- Dock -->
<div class="dock">
  <button class="sideBtn btn-calc" id="calcBtn">💰<br>寮費</button>
  <button class="fab" id="enterBtn">➕<br>入寮</button>
  <button class="sideBtn btn-wait" id="todayWaitBtn">📋<br>空室待ち</button>
</div>

<!-- 入寮登録 -->
<div class="modalBg" id="modalBg">
  <div class="modal">
    <h3>入寮者登録</h3>
    <input id="nameInput" placeholder="名前">
    <div class="colorPick">
      <div class="redPick" data-color="red"></div>
      <div class="bluePick" data-color="blue"></div>
      <div class="yellowPick" data-color="yellow"></div>
    </div>
    <button id="addBtn">追加</button>
    <button onclick="modalBg.style.display='none'">キャンセル</button>
  </div>
</div>

<!-- 寮費 -->
<div class="modalBg" id="feeModal">
  <div class="modal">
    <h3>個人別 寮費</h3>
    <input id="priceInput" type="number">
    <div id="feeList"></div>
    <button onclick="feeModal.style.display='none'">閉じる</button>
  </div>
</div>

<!-- 空室待ち -->
<div class="modalBg" id="waitModal">
  <div class="modal">
    <h3>今日の空室待ち</h3>
    <div class="listBox" id="waitList"></div>
    <button onclick="waitModal.style.display='none'">閉じる</button>
  </div>
</div>

<!-- 削除確認 -->
<div class="modalBg" id="deleteModal">
  <div class="modal">
    <h3 style="color:#ff6666;">削除確認</h3>
    <div id="deleteText"></div>
    <div style="display:flex;justify-content:space-around;margin-top:15px;">
      <button id="delYes" style="background:red;color:white;padding:8px 16px;border:none;border-radius:12px;">削除</button>
      <button id="delNo" style="background:#444;color:white;padding:8px 16px;border:none;border-radius:12px;">キャンセル</button>
    </div>
  </div>
</div>

<script>
// ===== Rooms =====
const roomNames=["P209","P306","P307","P507","FG406","空室待ち1","空室待ち2","空室待ち3","空室待ち4","空室待ち5"];
const rooms=roomNames.length;
const cellHeight=28,colWidth=80,headerHeight=28;

const scroll=document.getElementById("scroll");
const grid=document.getElementById("grid");
const monthPicker=document.getElementById("monthPicker");

const today=new Date();
monthPicker.value=today.toISOString().slice(0,7);

// ===== Grid =====
function buildGrid(y,m){
  grid.innerHTML="";
  const lastDay=new Date(y,m,0).getDate();
  window.totalRows=lastDay*2;

  grid.innerHTML+=`<div class="date sticky-corner">日付</div>`;
  roomNames.forEach(r=>grid.innerHTML+=`<div class="sticky-top">${r}</div>`);

  for(let d=1;d<=lastDay;d++){
    grid.innerHTML+=`<div class="date dateSpan sticky-left">${d}</div>`;
    for(let r=0;r<rooms;r++) grid.innerHTML+=`<div></div>`;
    for(let r=0;r<rooms;r++) grid.innerHTML+=`<div></div>`;
  }
}

// ===== Bar =====
function placeBar(bar,room,start,end){
  bar.dataset.room=room;
  bar.dataset.start=start;
  bar.dataset.end=end;
  bar.style.left=60+(room-1)*colWidth+"px";
  bar.style.top=headerHeight+(start-1)*cellHeight+"px";
  bar.style.height=(end-start+1)*cellHeight+"px";
  saveMonthData();autoCalc();
}

// ===== Drag =====
function makeDraggable(bar){
  let sx,sy,sl,st,resize=null;

  bar.addEventListener("pointerdown",e=>{
    resize=e.target.classList.contains("top")?"top":e.target.classList.contains("bottom")?"bottom":null;
    bar.setPointerCapture(e.pointerId);
    sx=e.clientX;sy=e.clientY;
    sl=parseInt(bar.style.left);
    st=parseInt(bar.style.top);
    bar.classList.add("dragging");
  });

  bar.addEventListener("pointermove",e=>{
    if(sx==null)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(resize==="top"){
      bar.style.top=st+dy+"px";
      bar.style.height=parseInt(bar.style.height)-dy+"px";
    }else if(resize==="bottom"){
      bar.style.height=parseInt(bar.style.height)+dy+"px";
      sy=e.clientY;
    }else{
      bar.style.left=sl+dx+"px";
      bar.style.top=st+dy+"px";
    }
  });

  bar.addEventListener("pointerup",()=>{
    sx=null;
    let top=parseInt(bar.style.top),left=parseInt(bar.style.left);
    let s=Math.round((top-headerHeight)/cellHeight)+1;
    let h=Math.round(parseInt(bar.style.height)/cellHeight);
    let e=s+h-1;
    let r=Math.round((left-60)/colWidth)+1;
    s=Math.max(1,Math.min(totalRows,s));
    e=Math.max(s,Math.min(totalRows,e));
    r=Math.max(1,Math.min(rooms,r));
    placeBar(bar,r,s,e);
    bar.classList.remove("dragging");
  });

  enableDoubleTapDelete(bar);
}

// ===== Double Tap Delete =====
let deleteTarget=null;
function enableDoubleTapDelete(bar){
  let lastTap=0;
  bar.addEventListener("pointerdown",()=>{
    const now=Date.now();
    if(now-lastTap<500){
      deleteTarget=bar;
      deleteText.textContent=bar.childNodes[0].nodeValue.trim()+" を削除しますか？";
      deleteModal.style.display="flex";
    }
    lastTap=now;
  });
}
delYes.onclick=()=>{if(deleteTarget){deleteTarget.remove();saveMonthData();autoCalc();}deleteModal.style.display="none";};
delNo.onclick=()=>deleteModal.style.display="none";

// ===== Storage =====
function saveMonthData(){
  const key="dorm_"+monthPicker.value;
  const data=[...document.querySelectorAll(".bar")].map(b=>({
    name:b.childNodes[0].nodeValue.trim(),
    room:b.dataset.room,start:b.dataset.start,end:b.dataset.end,
    color:[...b.classList].find(c=>["red","blue","yellow"].includes(c))
  }));
  localStorage.setItem(key,JSON.stringify(data));
}
function loadMonthData(){
  document.querySelectorAll(".bar").forEach(b=>b.remove());
  const key="dorm_"+monthPicker.value;
  const data=JSON.parse(localStorage.getItem(key)||"[]");
  data.forEach(d=>{
    const bar=document.createElement("div");
    bar.className="bar "+d.color;
    bar.innerHTML=`${d.name}<div class="handle top"></div><div class="handle bottom"></div>`;
    scroll.appendChild(bar);
    placeBar(bar,d.room,d.start,d.end);
    makeDraggable(bar);
  });
}

// ===== Add =====
let selectedColor="red";
document.querySelectorAll(".colorPick div").forEach(c=>c.onclick=()=>selectedColor=c.dataset.color);
enterBtn.onclick=()=>modalBg.style.display="flex";
addBtn.onclick=()=>{
  const name=nameInput.value.trim();
  if(!name)return alert("名前を入力");
  const count=document.querySelectorAll(".bar").length;
  const roomIndex=Math.min(count,rooms-1);
  const bar=document.createElement("div");
  bar.className="bar "+selectedColor;
  bar.innerHTML=`${name}<div class="handle top"></div><div class="handle bottom"></div>`;
  scroll.appendChild(bar);
  placeBar(bar,roomIndex+1,1,2);
  makeDraggable(bar);
  modalBg.style.display="none";
  nameInput.value="";
};

// ===== Fee =====
const priceInput=document.getElementById("priceInput");
const feeList=document.getElementById("feeList");
let pricePerNight=Number(localStorage.getItem("pricePerNight")||2500);
priceInput.value=pricePerNight;
calcBtn.onclick=()=>{feeModal.style.display="flex";autoCalc();};
priceInput.oninput=()=>{pricePerNight=Number(priceInput.value);localStorage.setItem("pricePerNight",pricePerNight);autoCalc();};

function autoCalc(){
  const map={};
  document.querySelectorAll(".bar").forEach(b=>{
    const name=b.childNodes[0].nodeValue.trim();
    const rows=parseInt(b.dataset.end)-parseInt(b.dataset.start)+1;
    const nights=Math.floor(rows/2);
    const fee=nights*pricePerNight;
    if(!map[name]) map[name]=0;
    map[name]+=fee;
  });
  feeList.innerHTML="";
  for(const n in map) feeList.innerHTML+=`${n}：${map[n].toLocaleString()} 円<br>`;
}

// ===== Today Wait =====
todayWaitBtn.onclick=()=>{
  waitList.innerHTML="";
  const [y,m]=monthPicker.value.split("-");
  const now=new Date();
  if(now.getFullYear()!=y || now.getMonth()+1!=m){
    waitList.innerHTML="※ 今月ではありません";
    waitModal.style.display="flex";
    return;
  }
  const day=now.getDate();
  const s=(day-1)*2+1, e=s+1;
  const waits=[...document.querySelectorAll(".bar")].filter(b=>{
    const r=parseInt(b.dataset.room);
    const bs=parseInt(b.dataset.start), be=parseInt(b.dataset.end);
    return r>=6 && !(be<s || bs>e);
  });
  waitList.innerHTML = waits.length ? waits.map(b=>b.childNodes[0].nodeValue.trim()).join("<br>") : "空室待ちはいません";
  waitModal.style.display="flex";
};

// ===== Month Change =====
monthPicker.onchange=()=>{
  const [y,m]=monthPicker.value.split("-");
  buildGrid(y,Number(m));
  loadMonthData();
};

// ===== スマホ入力時画面固定（追加） =====
const inputs=document.querySelectorAll("input");
inputs.forEach(i=>{
  i.addEventListener("focus",()=>{
    document.body.style.position="fixed";
    document.body.style.width="100%";
  });
  i.addEventListener("blur",()=>{
    document.body.style.position="";
    document.body.style.width="";
  });
});

// Init
buildGrid(today.getFullYear(),today.getMonth()+1);
loadMonthData();
</script>

</body>
</html>
