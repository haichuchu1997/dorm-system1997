<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<!-- LINE / iPhone 最適化 -->
<meta name="viewport" content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover
">

<title>入寮管理システム</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;font-family:'Nunito',system-ui;margin:0;padding:0;}

html,body{
  height:100%;
  background:radial-gradient(circle at top,#0f172a,#020617);
  color:white;
  overscroll-behavior:none;
}

/* Glass Base */
.glass{
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(20px);
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:0 20px 50px rgba(0,0,0,.4);
}

header{
  padding:16px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

/* Month */
.monthSelect{
  margin:10px;
  padding:12px;
  text-align:center;
}
.monthSelect input{
  padding:8px 14px;
  border-radius:12px;
  border:none;
  font-size:16px;
}

/* Grid */
.wrapper{padding:10px;height:calc(100vh - 250px);}
.scroll{
  overflow:auto;
  height:100%;
  position:relative;
  -webkit-overflow-scrolling:touch;
}
.grid{
  display:grid;
  grid-template-columns:60px repeat(10,80px);
  grid-auto-rows:28px;
  min-width:860px;
}
.grid div{
  height:28px;
  line-height:28px;
  font-size:12px;
  text-align:center;
  border-bottom:1px solid rgba(255,255,255,0.08);
  border-right:1px solid rgba(255,255,255,0.08);
}
.date{background:rgba(255,255,255,0.12);font-weight:bold;}
.dateSpan{grid-row:span 2;height:56px;line-height:56px;}
.sticky-top{position:sticky;top:0;z-index:5;background:rgba(0,0,0,0.7);}
.sticky-left{position:sticky;left:0;z-index:4;background:rgba(0,0,0,0.7);}
.sticky-corner{position:sticky;top:0;left:0;z-index:6;background:rgba(0,0,0,0.85);}

/* Bars */
.bar{
  position:absolute;width:80px;
  color:black;font-size:12px;font-weight:bold;
  display:flex;align-items:center;justify-content:center;
  border-radius:14px;
  touch-action:none;
  cursor:grab;
  backdrop-filter:blur(10px);
  box-shadow:0 10px 25px rgba(0,0,0,.4);
}
.bar.red{background:rgba(255,80,80,0.7);}
.bar.blue{background:rgba(80,180,255,0.7);}
.bar.yellow{background:rgba(255,255,80,0.7);}

/* Handles */
.handle{position:absolute;width:100%;height:6px;}
.handle.top{top:0;}
.handle.bottom{bottom:0;}

/* ================= GLASS DOCK ================= */
.dock{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:env(safe-area-inset-bottom);
  width:100%;
  max-width:720px;
  padding:14px 16px;
  display:flex;
  gap:12px;
  background:rgba(0,0,0,0.35);
  backdrop-filter:blur(25px);
  border-top:1px solid rgba(255,255,255,0.15);
  z-index:50;
}

/* Glass Button */
.dock button{
  flex:1;
  padding:14px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(15px);
  color:white;
  font-weight:bold;
  font-size:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  transition:.2s;
}
.dock button:hover{
  background:rgba(255,255,255,0.25);
}
.dock button:active{
  transform:scale(.95);
  box-shadow:0 0 15px rgba(0,255,255,.6);
}

/* Floating Add Button */
.fab{
  flex:0 0 80px;
  height:80px;
  border-radius:50%;
  font-size:18px;
  background:linear-gradient(135deg,#00e0ff,#ff00ff);
  color:black;
  box-shadow:0 15px 40px rgba(0,0,0,.7);
}

/* Modal */
.modalBg{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.65);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
}
.modal{
  background:rgba(30,30,60,0.95);
  backdrop-filter:blur(30px);
  padding:22px;
  border-radius:20px;
  width:320px;
  border:1px solid rgba(255,255,255,.2);
}
.modal input{
  width:100%;
  padding:10px;
  border-radius:12px;
  border:none;
  margin-bottom:10px;
  font-size:16px;
}
</style>
</head>

<body>

<header>🏢 入寮管理システム</header>

<div class="monthSelect glass">
表示月： <input type="month" id="monthPicker">
</div>

<div class="wrapper">
<div class="glass scroll" id="scroll">
<div class="grid" id="grid"></div>
</div>
</div>

<!-- Dock -->
<div class="dock">
<button id="calcBtn">💰 寮費</button>
<button id="enterBtn" class="fab">➕</button>
<button id="todayWaitBtn">📋 空室待ち</button>
</div>

<!-- 入寮 -->
<div class="modalBg" id="modalBg">
<div class="modal">
<h3>入寮者登録</h3>
<input id="nameInput" placeholder="名前">
<button id="addBtn">追加</button>
<button onclick="modalBg.style.display='none'">キャンセル</button>
</div>
</div>

<!-- 寮費 -->
<div class="modalBg" id="feeModal">
<div class="modal">
<h3>寮費</h3>
<input id="priceInput" type="number">
<div id="feeList"></div>
<button onclick="feeModal.style.display='none'">閉じる</button>
</div>
</div>

<!-- 空室待ち -->
<div class="modalBg" id="waitModal">
<div class="modal">
<h3>今日の空室待ち</h3>
<div id="waitList"></div>
<button onclick="waitModal.style.display='none'">閉じる</button>
</div>
</div>

<script>
// ===== Rooms =====
const roomNames=["P209","P306","P307","P507","FG406","空室待ち1","空室待ち2","空室待ち3","空室待ち4","空室待ち5"];
const rooms=roomNames.length;
const cellHeight=28,colWidth=80,headerHeight=28;

const scroll=document.getElementById("scroll");
const grid=document.getElementById("grid");
const monthPicker=document.getElementById("monthPicker");
const today=new Date();
monthPicker.value=today.toISOString().slice(0,7);

// ===== Grid =====
function buildGrid(y,m){
  grid.innerHTML="";
  const lastDay=new Date(y,m,0).getDate();
  window.totalRows=lastDay*2;
  grid.innerHTML+=`<div class="date sticky-corner">日付</div>`;
  roomNames.forEach(r=>grid.innerHTML+=`<div class="sticky-top">${r}</div>`);
  for(let d=1;d<=lastDay;d++){
    grid.innerHTML+=`<div class="date dateSpan sticky-left">${d}</div>`;
    for(let r=0;r<rooms*2;r++) grid.innerHTML+=`<div></div>`;
  }
}

// ===== Bar =====
function placeBar(bar,room,start,end){
  bar.dataset.room=room;
  bar.dataset.start=start;
  bar.dataset.end=end;
  bar.style.left=60+(room-1)*colWidth+"px";
  bar.style.top=headerHeight+(start-1)*cellHeight+"px";
  bar.style.height=(end-start+1)*cellHeight+"px";
}

// ===== Drag =====
function makeDraggable(bar){
  let sx,sy,sl,st;
  bar.onpointerdown=e=>{
    bar.setPointerCapture(e.pointerId);
    sx=e.clientX; sy=e.clientY;
    sl=parseInt(bar.style.left); st=parseInt(bar.style.top);
  };
  bar.onpointermove=e=>{
    if(!sx) return;
    bar.style.left=sl+(e.clientX-sx)+"px";
    bar.style.top=st+(e.clientY-sy)+"px";
  };
  bar.onpointerup=()=>{
    sx=null;
  };
}

// ===== Add =====
enterBtn.onclick=()=>modalBg.style.display="flex";
addBtn.onclick=()=>{
  const name=nameInput.value.trim();
  if(!name)return;
  const bar=document.createElement("div");
  bar.className="bar red";
  bar.textContent=name;
  scroll.appendChild(bar);
  placeBar(bar,1,1,2);
  makeDraggable(bar);
  modalBg.style.display="none";
};

// ===== Fee =====
calcBtn.onclick=()=>feeModal.style.display="flex";

// ===== Wait =====
todayWaitBtn.onclick=()=>{
  waitList.innerHTML="（デモ）空室待ちなし";
  waitModal.style.display="flex";
};

// Init
buildGrid(today.getFullYear(),today.getMonth()+1);
</script>

</body>
</html>
