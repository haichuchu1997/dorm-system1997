<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dorm Management ALL IN ONE</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
/* ===================================================
 GLOBAL STYLE
=================================================== */
body{
 margin:0;
 background:#070a12;
 color:white;
 font-family:Segoe UI,system-ui;
}

/* Hide both UI initially */
#pcUI,#mobileUI{display:none;}

/* ===================================================
 PC UI STYLE
=================================================== */
#pcUI{padding:16px;}
#pcToolbar{display:flex;gap:10px;padding:10px;background:#0c1324;border:1px solid #1e2b4d;border-radius:12px;}
#pcCalendarWrap{margin-top:10px;border:1px solid #1e2b4d;height:75vh;overflow:auto;position:relative;}
#pcCalendar{display:grid;grid-auto-rows:58px;}
.pcHeader,.pcRoom{background:#0f172a;border-bottom:1px solid #1e2b4d;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;}
.pcRoom{justify-content:flex-start;padding-left:10px;position:sticky;left:0;color:white;}
.pcCell{border:1px solid rgba(255,255,255,.03);}
#pcBlocks{position:absolute;top:0;left:0;pointer-events:none;}
.pcBlock{
 pointer-events:auto;
 position:absolute;
 height:34px;
 border-radius:10px;
 padding:0 10px;
 background:linear-gradient(135deg,#dc2626,#f97316);
 display:flex;align-items:center;font-weight:900;
}
.pcBlock.dragging{box-shadow:0 0 0 2px #4f8cff;}
.pcResize{position:absolute;right:0;top:0;bottom:0;width:16px;cursor:ew-resize;}

/* ===================================================
 MOBILE UI STYLE
=================================================== */
#mobileUI header{padding:12px;background:#0c1324;text-align:center;font-size:20px;font-weight:900;}
.mobileRoom{padding:10px;border-bottom:1px solid #1e2b4d;}
.mobileStay{padding:10px;margin:6px 0;background:#1f2937;border-radius:10px;font-size:16px;}
.mobileBtn{padding:10px;margin:6px;background:#2563eb;color:white;border:none;border-radius:10px;font-size:16px;}
#mobileModal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;}
#mobileModalBox{background:#0c1324;padding:20px;border-radius:12px;width:90%;}

/* Loading screen */
#loader{
 display:flex;
 align-items:center;
 justify-content:center;
 height:100vh;
 font-size:20px;
 font-weight:900;
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">端末判定中...</div>

<!-- ===================================================
 PC UI
=================================================== -->
<div id="pcUI">
<h2>寮管理システム PC</h2>
<div id="pcToolbar">
<button onclick="pcChangeMonth(-1)">←</button>
<span id="pcMonthLabel"></span>
<button onclick="pcChangeMonth(1)">→</button>
<input id="pcNewName" placeholder="名前">
<button onclick="pcAdd()">＋入居</button>
</div>

<div id="pcCalendarWrap">
<div id="pcCalendar"></div>
<div id="pcBlocks"></div>
</div>
</div>

<!-- ===================================================
 MOBILE UI
=================================================== -->
<div id="mobileUI">
<header>寮管理システム Mobile</header>
<button class="mobileBtn" onclick="mobileAdd()">＋入居追加</button>
<div id="mobileList"></div>

<div id="mobileModal">
<div id="mobileModalBox">
<h3>編集</h3>
<input id="mName"><br>
<input id="mStart" type="number"><br>
<input id="mEnd" type="number"><br>
<button class="mobileBtn" onclick="mobileSaveEdit()">保存</button>
<button class="mobileBtn" onclick="mobileCloseModal()">閉じる</button>
</div>
</div>
</div>

<script>
/* ===================================================
 DEVICE DETECT
=================================================== */
function isMobile(){
 const ua=navigator.userAgent;
 if(/android|iphone|ipad|ipod|mobile/i.test(ua)) return true;
 if(window.innerWidth<900) return true;
 return false;
}

/* ===================================================
 FIREBASE INIT
=================================================== */
firebase.initializeApp({
 apiKey:"AIzaSyAktEtPenYgXw1Xl5oAf7faiLLL0vCX4B0",
 authDomain:"dcpdcp-3e87c.firebaseapp.com",
 projectId:"dcpdcp-3e87c"
});
const db=firebase.firestore();

/* ===================================================
 SHARED STATE
=================================================== */
let current=new Date();
let stays=[];
let isLocal=false;
const rooms=["P209","P306","P307","P507","FG406"];

function key(){return current.getFullYear()+"-"+(current.getMonth()+1);}

/* ===================================================
 LOAD & REALTIME
=================================================== */
async function loadData(){
 const doc=await db.collection("dorm").doc(key()).get();
 if(doc.exists) stays=doc.data().stays||[];
}
async function saveData(){
 isLocal=true;
 await db.collection("dorm").doc(key()).set({stays});
 setTimeout(()=>isLocal=false,200);
}
function realtime(){
 db.collection("dorm").doc(key()).onSnapshot(d=>{
  if(!d.exists||isLocal)return;
  stays=d.data().stays||[];
  pcRender();mobileRender();
 });
}

/* ===================================================
 PC UI LOGIC
=================================================== */
const PC={CELL:46,ROW:58,ROOMW:200,DAYS:60};

function pcUpdateMonth(){
 PC.DAYS=new Date(current.getFullYear(),current.getMonth()+1,0).getDate()*2;
 pcMonthLabel.textContent=current.getFullYear()+"年"+(current.getMonth()+1)+"月";
}
function pcCell(c,t=""){let d=document.createElement("div");d.className=c;d.textContent=t;return d;}
function pcGrid(){
 pcCalendar.innerHTML="";
 pcCalendar.style.gridTemplateColumns=`200px repeat(${PC.DAYS},46px)`;
 pcCalendar.append(pcCell("pcHeader","部屋"));
 for(let d=1;d<=PC.DAYS/2;d++){let h=pcCell("pcHeader",d);h.style.gridColumn="span 2";pcCalendar.append(h);}
 rooms.forEach(r=>{pcCalendar.append(pcCell("pcRoom",r));for(let i=0;i<PC.DAYS;i++)pcCalendar.append(pcCell("pcCell"));});
}
function pcPos(el,s){
 el.style.left=200+(s.start-1)*46+"px";
 el.style.top=58*(s.room+1)+12+"px";
 el.style.width=(s.end-s.start+1)*46+"px";
}
function pcBlocks(){
 pcBlocks.innerHTML="";
 stays.forEach(s=>{
  let b=document.createElement("div");
  b.className="pcBlock";
  b.textContent=s.name;
  b.dataset.id=s.id;
  pcPos(b,s);
  b.onmousedown=pcStartMove;
  let r=document.createElement("div");
  r.className="pcResize";
  r.onmousedown=e=>pcStartResize(e,s.id);
  b.appendChild(r);
  pcBlocks.appendChild(b);
 });
}
let pcMove=null;
function pcStartMove(e){
 let s=stays.find(x=>x.id==this.dataset.id);
 pcMove={s,block:this,startX:e.clientX,startY:e.clientY,baseStart:s.start,baseRoom:s.room,duration:s.end-s.start};
 document.onmousemove=pcMoveFrame;
 document.onmouseup=pcSnapMove;
}
function pcMoveFrame(e){
 let dx=Math.round((e.clientX-pcMove.startX)/46);
 let dy=Math.round((e.clientY-pcMove.startY)/58);
 pcMove.block.style.left=200+(pcMove.baseStart+dx-1)*46+"px";
 pcMove.block.style.top=58*(pcMove.baseRoom+dy+1)+"px";
}
function pcSnapMove(){
 let s=pcMove.s;
 s.start=Math.max(1,Math.round((parseInt(pcMove.block.style.left)-200)/46)+1);
 s.room=Math.max(0,Math.round(parseInt(pcMove.block.style.top)/58)-1);
 s.end=s.start+pcMove.duration;
 pcMove=null;
 pcRender();
}
let pcResize=null;
function pcStartResize(e,id){
 pcResize={id,startX:e.clientX,startW:document.querySelector(`[data-id="${id}"]`).offsetWidth};
 document.onmousemove=pcResizeFrame;document.onmouseup=pcSnapResize;e.stopPropagation();
}
function pcResizeFrame(e){
 document.querySelector(`[data-id="${pcResize.id}"]`).style.width=pcResize.startW+(e.clientX-pcResize.startX)+"px";
}
function pcSnapResize(){
 let s=stays.find(x=>x.id==pcResize.id);
 s.end=s.start+Math.round(document.querySelector(`[data-id="${pcResize.id}"]`).offsetWidth/46)-1;
 pcResize=null;
 pcRender();
}
function pcAdd(){
 stays.push({id:Date.now(),name:pcNewName.value,start:1,end:2,room:0});
 pcRender();
}
async function pcRender(){
 pcGrid();
 pcBlocks();
 await saveData();
}
async function pcChangeMonth(d){
 await saveData();
 current.setMonth(current.getMonth()+d);
 pcUpdateMonth();
 await loadData();
 pcRender();
}

/* ===================================================
 MOBILE UI LOGIC (NO DRAG)
=================================================== */
let editId=null;
function mobileRender(){
 let html="";
 stays.forEach(s=>{
  html+=`<div class="mobileStay" onclick="mobileEdit(${s.id})">${s.name} / ${s.start}-${s.end}</div>`;
 });
 mobileList.innerHTML=html;
}
function mobileAdd(){
 stays.push({id:Date.now(),name:"新規",start:1,end:2,room:0});
 saveData();
}
function mobileEdit(id){
 let s=stays.find(x=>x.id==id);
 editId=id;
 mName.value=s.name;
 mStart.value=s.start;
 mEnd.value=s.end;
 mobileModal.style.display="flex";
}
function mobileCloseModal(){mobileModal.style.display="none";}
function mobileSaveEdit(){
 let s=stays.find(x=>x.id==editId);
 s.name=mName.value;
 s.start=parseInt(mStart.value);
 s.end=parseInt(mEnd.value);
 saveData();
 mobileCloseModal();
}

/* ===================================================
 INIT
=================================================== */
(async ()=>{
 await loadData();
 realtime();
 if(isMobile()){
  loader.style.display="none";
  mobileUI.style.display="block";
  mobileRender();
 }else{
  loader.style.display="none";
  pcUI.style.display="block";
  pcUpdateMonth();
  pcRender();
 }
})();
</script>

</body>
</html>
