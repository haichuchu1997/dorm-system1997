<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<!-- ✅ iPhone / LINE 内ブラウザ最適 viewport -->
<meta name="viewport" content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover
">

<title>入寮管理システム</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;font-family:'Nunito',system-ui;margin:0;padding:0;}

html,body{
  height:100%;
  background:radial-gradient(circle at top,#0f172a,#020617);
  color:white;
  overscroll-behavior: none;
  touch-action: manipulation;
}

/* LINE内ブラウザ 二重スクロール防止 */
body{
  overflow:hidden;
  padding-bottom:env(safe-area-inset-bottom);
}

/* Glass UI */
.glass{
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(20px);
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:0 20px 50px rgba(0,0,0,.4);
}

header{
  padding:16px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  letter-spacing:.5px;
}

/* Month selector */
.monthSelect{
  margin:10px;
  padding:12px;
  text-align:center;
}
.monthSelect input{
  padding:8px 14px;
  border-radius:12px;
  border:none;
  font-size:16px; /* iOS zoom防止 */
}

/* Grid wrapper */
.wrapper{
  padding:10px;
  height:calc(100vh - 240px);
}
.scroll{
  overflow:auto;
  height:100%;
  position:relative;
  -webkit-overflow-scrolling:touch;
}
.grid{
  display:grid;
  grid-template-columns:60px repeat(10,80px);
  grid-auto-rows:28px;
  min-width:860px;
}
.grid div{
  height:28px;
  line-height:28px;
  font-size:12px;
  text-align:center;
  border-bottom:1px solid rgba(255,255,255,0.08);
  border-right:1px solid rgba(255,255,255,0.08);
}
.date{background:rgba(255,255,255,0.12);font-weight:bold;}
.dateSpan{grid-row:span 2;height:56px;line-height:56px;}
.sticky-top{position:sticky;top:0;z-index:5;background:rgba(0,0,0,0.7);}
.sticky-left{position:sticky;left:0;z-index:4;background:rgba(0,0,0,0.7);}
.sticky-corner{position:sticky;top:0;left:0;z-index:6;background:rgba(0,0,0,0.85);}

/* Bars */
.bar{
  position:absolute;width:80px;
  color:black;font-size:12px;font-weight:bold;
  display:flex;align-items:center;justify-content:center;
  border-radius:14px;
  touch-action:none;
  cursor:grab;
  box-shadow:0 10px 25px rgba(0,0,0,.4);
  transition:.15s;
}
.bar:active{transform:scale(1.02);}
.bar::before{
  content:"";
  position:absolute;
  inset:2px;
  border-radius:14px;
  z-index:-1;
}
.bar.red{background:rgba(255,80,80,0.7);}
.bar.red::before{background:#ff1a1a;}
.bar.blue{background:rgba(80,180,255,0.7);}
.bar.blue::before{background:#0080ff;}
.bar.yellow{background:rgba(255,255,80,0.7);}
.bar.yellow::before{background:#ffcc00;}

.handle{position:absolute;width:100%;height:6px;}
.handle.top{top:0;}
.handle.bottom{bottom:0;}

/* Dock */
.dock{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:env(safe-area-inset-bottom);
  width:100%;
  max-width:720px;
  padding:16px 20px 22px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:14px;
  background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.85));
  backdrop-filter:blur(20px);
  z-index:50;
}
.dock .sideBtn{
  flex:1;border:none;padding:14px;border-radius:18px;
  font-weight:bold;font-size:15px;text-align:center;color:black;
}
.dock .fab{
  width:88px;height:88px;border-radius:50%;
  border:none;font-size:18px;font-weight:bold;
  background:linear-gradient(135deg,#ff0080,#ffcc00);
}

/* Modal */
.modalBg{
  position:fixed;inset:0;background:rgba(0,0,0,0.65);
  display:none;align-items:center;justify-content:center;z-index:99;
}
.modal{
  background:linear-gradient(180deg,rgba(40,40,80,.95),rgba(10,10,30,.95));
  padding:22px;border-radius:22px;width:320px;text-align:center;
}
.modal input{
  width:100%;padding:10px;border-radius:12px;border:none;margin-bottom:10px;
  font-size:16px; /* iOS zoom防止 */
}
</style>

<!-- ✅ LINE内ブラウザ警告（任意） -->
<script>
(function(){
  const ua = navigator.userAgent;
  if(ua.includes("Line")){
    console.log("LINE内ブラウザ検知");
  }
})();
</script>

</head>

<body>

<header>🏢 入寮管理システム</header>

<div class="monthSelect glass">
表示月： <input type="month" id="monthPicker">
</div>

<div class="wrapper">
<div class="glass scroll" id="scroll">
<div class="grid" id="grid"></div>
</div>
</div>

<div class="dock">
<button id="calcBtn" class="sideBtn">💰 寮費</button>
<button id="enterBtn" class="fab">➕ 入寮</button>
<button id="todayWaitBtn" class="sideBtn">📋 空室待ち</button>
</div>

<!-- 入寮登録 -->
<div class="modalBg" id="modalBg">
<div class="modal">
<h3>入寮者登録</h3>
<input id="nameInput" placeholder="名前">
<button id="addBtn">追加</button>
<button onclick="modalBg.style.display='none'">キャンセル</button>
</div>
</div>

<script>
// ===== LINE iOS キーボード時 画面固定 =====
document.querySelectorAll("input").forEach(i=>{
  i.addEventListener("focus",()=>{
    document.body.style.position="fixed";
    document.body.style.width="100%";
  });
  i.addEventListener("blur",()=>{
    document.body.style.position="";
    document.body.style.width="";
  });
});

// ===== 以下は元システム最低限のGrid生成 =====
const roomNames=["P209","P306","P307","P507","FG406","空室待ち1","空室待ち2","空室待ち3","空室待ち4","空室待ち5"];
const rooms=roomNames.length;
const cellHeight=28,colWidth=80,headerHeight=28;
const grid=document.getElementById("grid");
const scroll=document.getElementById("scroll");
const monthPicker=document.getElementById("monthPicker");
const today=new Date();
monthPicker.value=today.toISOString().slice(0,7);

function buildGrid(y,m){
  grid.innerHTML="";
  const lastDay=new Date(y,m,0).getDate();
  window.totalRows=lastDay*2;
  grid.innerHTML+=`<div class="date sticky-corner">日付</div>`;
  roomNames.forEach(r=>grid.innerHTML+=`<div class="sticky-top">${r}</div>`);
  for(let d=1;d<=lastDay;d++){
    grid.innerHTML+=`<div class="date dateSpan sticky-left">${d}</div>`;
    for(let r=0;r<rooms*2;r++) grid.innerHTML+=`<div></div>`;
  }
}
buildGrid(today.getFullYear(),today.getMonth()+1);
</script>

</body>
</html>
